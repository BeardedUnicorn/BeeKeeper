[package]
name = "beekeeper"
version = "0.1.0"
description = "A cozy strategy sim about managing hives across seasons."
authors = ["Mike Herold"]
license = "MIT"
repository = "https://github.com/BeardedUnicorn/BeeKeeper"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "beekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-fs = "2.7.1"
